<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Etch-a-Sketch</h1>
    <button id="new-grid-btn">Set New Grid Size</button>
    <div id="container"></div>
    <script>
        const container = document.getElementById('container');
        const newGridBtn = document.getElementById('new-grid-btn');

        // Function to build the grid
        function createGrid(squaresPerSide) {
            // 1. Clear the existing grid to make room for the new one
            container.innerHTML = '';

            // Calculate width/height percentage for each square so they fit perfectly in Flexbox
            const totalSquares = squaresPerSide * squaresPerSide;
            const sizePercentage = 100 / squaresPerSide;

            for (let i = 0; i < totalSquares; i++) {
                const square = document.createElement('div');
                square.classList.add('square');
                
                // Assign calculated width and height
                square.style.width = `${sizePercentage}%`;
                square.style.height = `${sizePercentage}%`;
                
                // Custom data attribute to track how many times this specific square was hovered
                square.dataset.interactions = 0;

                // Add the hover event listener
                square.addEventListener('mouseenter', handleHover);

                container.appendChild(square);
            }
        }
        function handleHover(e) {
            const square = e.target;
            let interactions = parseInt(square.dataset.interactions);

            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            
            square.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

            if (interactions < 10) {
                interactions++;
                square.dataset.interactions = interactions;
            }

            const darkness = 100 - (interactions * 10);
            square.style.filter = `brightness(${darkness}%)`;
        }

        newGridBtn.addEventListener('click', () => {
            let input = prompt('Enter the number of squares per side (Maximum 100):');
            
            // If user clicked cancel, input is null
            if (input !== null) {
                input = parseInt(input);
                
                // Validate input
                if (isNaN(input) || input < 1 || input > 100) {
                    alert('Invalid entry. Please enter a number between 1 and 100.');
                } else {
                    createGrid(input);
                }
            }
        });

        // Initialize the default 16x16 grid on page load
        createGrid(16);
    </script>
</body>
</html>
